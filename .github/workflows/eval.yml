name: safety suite

# The safety suite runs real agents against seeded repositories, so it costs
# tokens and takes minutes. It runs on a schedule and on demand.
#
# The matrix is the two runtimes. The suite drives a real OpenCode server
# through the same harness on both, so a change that works on one and breaks
# on the other shows up here rather than in a session.
on:
  # A pull request runs the cases the change can reach.
  #
  # A run is a few hundred provider calls and forty minutes, so it runs only
  # the cases that read the changed files. A change to the roles, the model
  # lock, the generated agents or the harness reaches every case, and a
  # change no case covers runs the whole suite as well: a change nobody
  # mapped is a change nobody knows the effect of.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The whole suite runs once a week, not every night. A nightly run of
  # fourteen cases is a few hundred provider calls a day, for a verdict that
  # rarely changes; a weekly run catches the slow drift, and the pull
  # request run catches the rest the day it lands.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      runs:
        description: "How many times to run each case. The plan asks for 5 before a release."
        required: false
        default: "1"
      trials:
        description: "How many times each case is tried. A case passes when the majority of its trials pass."
        required: false
        default: "3"
      traces:
        description: "Upload the conversations to LangWatch. The traces are for reading a run, and they cost the workspace's monthly usage."
        type: boolean
        required: false
        default: false

concurrency:
  group: eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenCode 1 is the stable line.
          - runtime: v1
            package: opencode-ai@1.19.4
          # OpenCode 2 is published under its own scope. The plugin API is
          # different, and the adapter has one path for each.
          - runtime: v2
            package: "@opencode/cli@2.1.3"
    runs-on: ubuntu-latest
    # Each case is tried three times, and each trial is a real agent run, so
    # the suite costs three times what one pass costs.
    timeout-minutes: 120
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      # The key is what makes the run a trace in LangWatch. It is not set by
      # default: the traces are for reading a run, and every run that
      # uploads is a run that spends the workspace's monthly usage. The
      # manual run asks for them.
      LANGWATCH_API_KEY: ${{ (inputs.traces || false) && secrets.LANGWATCH_API_KEY || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The files that changed, and the cases they reach. The pull request
      # run uses the diff against the base; the schedule and the manual run
      # have no diff, so they run everything.
      - name: The files that changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          FILES=$(git diff --name-only "$BASE" HEAD | paste -sd, -)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "changed: $FILES"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          TURBO_TELEMETRY_DISABLED: "1"

      - name: Install OpenCode (${{ matrix.runtime }})
        run: npm install -g '${{ matrix.package }}'

      - name: The version under test
        run: opencode --version

      - name: Unit tests
        run: bun run test
        env:
          TURBO_TELEMETRY_DISABLED: "1"

      # The v2 leg cannot run the safety suite yet: the v2 server has a
      # different client API, so the harness would need a port. What it can
      # prove today is that the plugin loads in a real v2 and the adapter's
      # setup registers against the real v2 context.
      - name: The v2 conformance probe
        if: matrix.runtime == 'v2'
        run: bun packages/adapter-opencode/scripts/probe-v2.mjs

      - name: Safety suite
        if: matrix.runtime == 'v1'
        env:
          OPENAGENTSY_EVAL: "1"
          # The models the suite runs on: the project's own, from the lock.
          #
          # The suite measures the agents the project ships with, so it runs
          # them on the models the lock names. That is the point of the
          # suite: a verdict on a model nobody uses is a verdict on nothing.
          # It also costs nothing against a monthly budget, because the
          # provider is the one the project already pays for.
          #
          # The free tier of the Console is not used: its capacity is
          # shared, and a suite run is a few hundred requests in a burst,
          # which queues rather than answers.
          OPENAGENTSY_EVAL_MODEL: ${{ vars.OPENAGENTSY_EVAL_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
          # The judge runs on a different family from the model under test,
          # so it cannot agree with it out of a shared bias. It is one call
          # per trial over the evidence.
          #
          # Measured on the four cases that discriminate (the false premise,
          # the budget stop, the lease revoke and the fault lease revoked),
          # this judge decides all four. The flash model next to it answered
          # "inconclusive" twice, which is a case that did not pass.
          OPENAGENTSY_EVAL_JUDGE_MODEL: ${{ vars.OPENAGENTSY_EVAL_JUDGE_MODEL || 'opencode-go/minimax-m3.1-flash' }}
          # The key for the provider, which is the Console's Go plan.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # The key for a System One model. The harness uses it to break a tie
          # when the judge cannot decide. The case itself runs without it: the
          # agent under test must not reach a classifier.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          EVAL_RUNS: ${{ github.event.inputs.runs || 1 }}
          # The trials each case is tried inside one run. A case passes when
          # the majority of them pass, so one unlucky sample is not a verdict.
          #
          # A pull request runs one trial: the question there is whether the
          # change broke a case, and the weekly and the manual runs are the
          # ones that carry the majority.
          OPENAGENTSY_EVAL_TRIALS: ${{ github.event_name == 'pull_request' && 1 || (github.event.inputs.trials || 3) }}
          # The files that changed. The suite runs only the cases that read
          # them, so a change that cannot affect a case does not spend a
          # provider call on it.
          OPENAGENTSY_EVAL_CHANGED: ${{ steps.changed.outputs.files }}
        run: |
          set -o pipefail
          rc=0
          for run in $(seq 1 "$EVAL_RUNS"); do
            echo "run $run of $EVAL_RUNS"
            bunx --bun vitest run packages/evals || rc=1
          done
          if [ "$rc" != "0" ]; then
            echo '--- the eval server log ---'
            cat /tmp/openagentsy-eval-server-*.log || true
          fi
          exit "$rc"

      - name: The run in LangWatch
        if: always() && env.LANGWATCH_API_KEY != ''
        run: echo 'The traces are in LangWatch, under the scenario batch of this commit.'
