name: safety suite

# The safety suite runs real agents against seeded repositories, so it costs
# tokens and takes minutes. It runs on a schedule and on demand.
#
# The matrix is the two runtimes. The suite drives a real OpenCode server
# through the same harness on both, so a change that works on one and breaks
# on the other shows up here rather than in a session.
on:
  # The suite does not run on a push.
  #
  # A run is real agents against real sessions: a few hundred provider
  # calls, and it takes forty minutes. Running it on every push to a
  # pull request cost a day of a month's budget in one afternoon, and the
  # verdict it gave on a push was the same verdict the nightly gives: the
  # push gate is the cheap checks, and the safety suite is the nightly and
  # the manual run.
  #
  # A pull request can ask for it: the "Safety suite" workflow is
  # dispatchable, and it takes the pull request number as an input.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "How many times to run each case. The plan asks for 5 before a release."
        required: false
        default: "1"
      trials:
        description: "How many times each case is tried. A case passes when the majority of its trials pass."
        required: false
        default: "3"

concurrency:
  group: eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenCode 1 is the stable line.
          - runtime: v1
            package: opencode-ai@1.19.4
          # OpenCode 2 is published under its own scope. The plugin API is
          # different, and the adapter has one path for each.
          - runtime: v2
            package: "@opencode/cli@2.1.3"
    runs-on: ubuntu-latest
    # Each case is tried three times, and each trial is a real agent run, so
    # the suite costs three times what one pass costs.
    timeout-minutes: 120
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      # The key is what makes the run a trace in LangWatch. Without it the
      # cases still run, and the conversations stay on the machine.
      LANGWATCH_API_KEY: ${{ secrets.LANGWATCH_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          TURBO_TELEMETRY_DISABLED: "1"

      - name: Install OpenCode (${{ matrix.runtime }})
        run: npm install -g '${{ matrix.package }}'

      - name: The version under test
        run: opencode --version

      - name: Unit tests
        run: bun run test
        env:
          TURBO_TELEMETRY_DISABLED: "1"

      # The v2 leg cannot run the safety suite yet: the v2 server has a
      # different client API, so the harness would need a port. What it can
      # prove today is that the plugin loads in a real v2 and the adapter's
      # setup registers against the real v2 context.
      - name: The v2 conformance probe
        if: matrix.runtime == 'v2'
        run: bun packages/adapter-opencode/scripts/probe-v2.mjs

      - name: Safety suite
        if: matrix.runtime == 'v1'
        env:
          OPENAGENTSY_EVAL: "1"
          # The models the suite runs on. The agents under test and the judge
          # run on the OpenCode Console free tier, which costs nothing: the
          # suite runs real agents, and a run costs tokens, so a paid model
          # turns the quality gate into a budget line. The free tier is
          # reachable only from inside OpenCode, which is what the suite is.
          # The variables below swap the models without a code change.
          #
          # The model the agents under test run on. It has to follow a
          # multi part instruction on the first try, and it has to push back
          # on a claim that is wrong: the suite measures both.
          OPENAGENTSY_EVAL_MODEL: ${{ vars.OPENAGENTSY_EVAL_MODEL || 'opencode/deepseek-v4.1-flash-free' }}
          # The judge runs on a different family from the model under test,
          # so it cannot agree with it out of a shared bias. The judge is one
          # call per trial over the evidence, so it is cheap: a few cents a
          # run.
          OPENAGENTSY_EVAL_JUDGE_MODEL: ${{ vars.OPENAGENTSY_EVAL_JUDGE_MODEL || 'opencode/mimo-v2.6-flash' }}
          # The key for the Console, where the free tier lives.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # The key for a System One model. The harness uses it to break a tie
          # when the judge cannot decide. The case itself runs without it: the
          # agent under test must not reach a classifier.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          EVAL_RUNS: ${{ github.event.inputs.runs || 1 }}
          # The trials each case is tried inside one run. A case passes when
          # the majority of them pass, so one unlucky sample is not a verdict.
          OPENAGENTSY_EVAL_TRIALS: ${{ github.event.inputs.trials || 3 }}
        run: |
          set -o pipefail
          rc=0
          for run in $(seq 1 "$EVAL_RUNS"); do
            echo "run $run of $EVAL_RUNS"
            bunx --bun vitest run packages/evals || rc=1
          done
          if [ "$rc" != "0" ]; then
            echo '--- the eval server log ---'
            cat /tmp/openagentsy-eval-server-*.log || true
          fi
          exit "$rc"

      - name: The run in LangWatch
        if: always() && env.LANGWATCH_API_KEY != ''
        run: echo 'The traces are in LangWatch, under the scenario batch of this commit.'
