name: safety suite

# The safety suite runs real agents against seeded repositories, so it costs
# tokens and takes minutes. It runs on a schedule and on demand.
#
# The matrix is the two runtimes. The suite drives a real OpenCode server
# through the same harness on both, so a change that works on one and breaks
# on the other shows up here rather than in a session.
on:
  # A pull request runs the cases the change can reach.
  #
  # A run is a few hundred provider calls and forty minutes, so it runs only
  # the cases that read the changed files. A change to the roles, the model
  # lock, the generated agents or the harness reaches every case, and a
  # change no case covers runs the whole suite as well: a change nobody
  # mapped is a change nobody knows the effect of.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The whole suite runs once a week, not every night. A nightly run of
  # fourteen cases is a few hundred provider calls a day, for a verdict that
  # rarely changes; a weekly run catches the slow drift, and the pull
  # request run catches the rest the day it lands.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      runs:
        description: "How many times to run each case. The plan asks for 5 before a release."
        required: false
        default: "1"
      trials:
        description: "How many times each case is tried. A case passes when the majority of its trials pass."
        required: false
        default: "3"
      traces:
        description: "Upload the conversations to LangWatch. The traces are for reading a run, and they cost the workspace's monthly usage."
        type: boolean
        required: false
        default: false

concurrency:
  group: eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenCode 1 is the stable line.
          - runtime: v1
            package: opencode-ai@1.19.4
          # OpenCode 2 is published under its own scope. The plugin API is
          # different, and the adapter has one path for each.
          - runtime: v2
            package: "@opencode/cli@2.1.3"
    runs-on: ubuntu-latest
    # Each case is tried three times, and each trial is a real agent run, so
    # the suite costs three times what one pass costs.
    timeout-minutes: 120
    env:
      # The keys for the providers. The provider in the model id decides
      # which one a run uses, so the job passes both.
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      # The key is what makes the run a trace in LangWatch. It is not set by
      # default: the traces are for reading a run, and every run that
      # uploads is a run that spends the workspace's monthly usage. The
      # manual run asks for them.
      LANGWATCH_API_KEY: ${{ (inputs.traces || false) && secrets.LANGWATCH_API_KEY || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The models the suite runs on. The suite measures the agents the
      # project ships with, so it runs them on the models the lock names: a
      # verdict on a model nobody uses is a verdict on nothing.
      #
      # The builder's model is the model under test, and the reviewer's model
      # is the judge. The two are not the same family, because the lock keeps
      # the reviewer on another creator than the builder (the
      # differentCreatorThan rule in roles.yaml), and a judge that shares a
      # family with the model it judges can agree with it out of a shared
      # bias.
      #
      # A repository variable still overrides each of them, the way it always
      # has. Every value that comes from the repository reaches the shell
      # through the environment, and the model id is checked before it is
      # exported, so a lock that names something that is not a model id stops
      # the run instead of riding into it.
      - name: The models the lock names
        if: matrix.runtime == 'v1'
        env:
          LOCK_FILE: openagentsy.models.lock.json
          REPO_EVAL_MODEL: ${{ vars.OPENAGENTSY_EVAL_MODEL }}
          REPO_EVAL_JUDGE_MODEL: ${{ vars.OPENAGENTSY_EVAL_JUDGE_MODEL }}
        run: |
          set -eu
          if [ ! -f "$LOCK_FILE" ]; then
            echo "no model lock file: $LOCK_FILE"
            exit 1
          fi
          BUILDER_MODEL=$(jq -r '.roles.builder.model // empty' "$LOCK_FILE")
          REVIEWER_MODEL=$(jq -r '.roles.reviewer.model // empty' "$LOCK_FILE")
          if [ -z "$BUILDER_MODEL" ] || [ -z "$REVIEWER_MODEL" ]; then
            echo "the lock does not name a builder and a reviewer model: $LOCK_FILE"
            exit 1
          fi
          EVAL_MODEL="${REPO_EVAL_MODEL:-$BUILDER_MODEL}"
          EVAL_JUDGE_MODEL="${REPO_EVAL_JUDGE_MODEL:-$REVIEWER_MODEL}"
          for MODEL in "$EVAL_MODEL" "$EVAL_JUDGE_MODEL"; do
            case "$MODEL" in
              *[!A-Za-z0-9._:/-]*)
                echo "the lock names a model id that is not one: $MODEL"
                exit 1
                ;;
            esac
          done
          echo "model under test: $EVAL_MODEL"
          echo "judge: $EVAL_JUDGE_MODEL"
          echo "OPENAGENTSY_EVAL_MODEL=$EVAL_MODEL" >> "$GITHUB_ENV"
          echo "OPENAGENTSY_EVAL_JUDGE_MODEL=$EVAL_JUDGE_MODEL" >> "$GITHUB_ENV"

      # The files that changed, and the cases they reach. The pull request
      # run uses the commits this push carried; the schedule and the manual
      # run have no diff, so they run everything.
      #
      # The pull request's whole diff is the wrong scope: the release pull
      # request carries every change since the last release, so every push
      # to it would run every case, over and over, for the same code.
      #
      # The event data comes in through the environment, never through the
      # script: a value the workflow interpolates into a run block is a
      # value a pull request can write.
      - name: The files that changed
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.event.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="$EVENT_BEFORE"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only "$BEFORE" "$EVENT_SHA" | paste -sd, -)
          else
            BASE=$(git merge-base "origin/$BASE_REF" HEAD)
            FILES=$(git diff --name-only "$BASE" HEAD | paste -sd, -)
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "changed: $FILES"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          TURBO_TELEMETRY_DISABLED: "1"

      - name: Install OpenCode
        env:
          RUNTIME: ${{ matrix.runtime }}
          PACKAGE: ${{ matrix.package }}
        run: |
          echo "installing OpenCode ($RUNTIME)"
          npm install -g "$PACKAGE"

      - name: The version under test
        run: opencode --version

      - name: Unit tests
        run: bun run test
        env:
          TURBO_TELEMETRY_DISABLED: "1"

      # The v2 leg cannot run the safety suite yet: the v2 server has a
      # different client API, so the harness would need a port. What it can
      # prove today is that the plugin loads in a real v2 and the adapter's
      # setup registers against the real v2 context.
      - name: The v2 conformance probe
        if: matrix.runtime == 'v2'
        run: bun packages/adapter-opencode/scripts/probe-v2.mjs

      - name: The provider answers
        if: matrix.runtime == 'v1'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          # One turn before the suite, on the model the suite will use. A key
          # that is refused makes every turn in the suite wait for an answer
          # that never comes, and a suite that waits for forty minutes says
          # nothing about the code it was testing. This fails in two minutes,
          # with the provider's own error.
          #
          # The model is the one the suite runs on, read the same way: the
          # step above put it in the environment, and this reads the same
          # variable.
          if ! timeout 120 opencode run --model "$OPENAGENTSY_EVAL_MODEL" "Reply with exactly: ok"; then
            echo "the provider did not answer: the key or the model ($OPENAGENTSY_EVAL_MODEL) is wrong"
            exit 1
          fi

      - name: Safety suite
        if: matrix.runtime == 'v1'
        env:
          OPENAGENTSY_EVAL: "1"
          # The models the suite runs on are already in the environment: the
          # step above read them from the lock, and a repository variable
          # still overrides each of them.
          #
          # The model under test is the builder's model and the judge is the
          # reviewer's model. The two are not the same family, so the judge
          # cannot agree with the model under test out of a shared bias.
          #
          # The key is the one the provider in the model id reads: the job
          # passes the Console key and the Ollama Cloud key, and the provider
          # decides which one the run uses.
          #
          # The key for a System One model. The harness uses it to break a tie
          # when the judge cannot decide. The case itself runs without it: the
          # agent under test must not reach a classifier.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          EVAL_RUNS: ${{ github.event.inputs.runs || 1 }}
          # The trials each case is tried inside one run. A case passes when
          # the majority of them pass, so one unlucky sample is not a verdict.
          #
          # A pull request runs one trial: the question there is whether the
          # change broke a case, and the weekly and the manual runs are the
          # ones that carry the majority.
          OPENAGENTSY_EVAL_TRIALS: ${{ github.event_name == 'pull_request' && 1 || (github.event.inputs.trials || 3) }}
          # The files that changed. The suite runs only the cases that read
          # them, so a change that cannot affect a case does not spend a
          # provider call on it.
          OPENAGENTSY_EVAL_CHANGED: ${{ steps.changed.outputs.files }}
          # How many cases run at once. The suite runs the cases side by
          # side, and a case is not one session: it runs a Lead, the builder
          # the Lead dispatches and the judge, so a cap of three cases is
          # about ten concurrent sessions and a cap of five is about
          # fifteen. Five keeps the provider's patience and takes about a
          # third off the wall time.
          #
          # The number of provider calls does not change with the cap, so
          # the cost of a run does not change either: only the wall time
          # does. The number is written here, so the run's cap is in the
          # workflow and not only in the code, and the environment still
          # overrides the code's default.
          OPENAGENTSY_EVAL_CONCURRENCY: "5"
        run: |
          set -o pipefail
          rc=0
          for run in $(seq 1 "$EVAL_RUNS"); do
            echo "run $run of $EVAL_RUNS"
            # The verbose reporter prints each case as it finishes. The suite
            # is one test file, so the default reporter prints nothing at all
            # until every case is done, and a run that looks stalled is a run
            # nobody can tell from a hung one.
            bunx --bun vitest run --reporter=verbose packages/evals || rc=1
          done
          if [ "$rc" != "0" ]; then
            echo '--- the eval server log ---'
            cat /tmp/openagentsy-eval-server-*.log || true
          fi
          exit "$rc"

      - name: The run in LangWatch
        if: always() && env.LANGWATCH_API_KEY != ''
        run: echo 'The traces are in LangWatch, under the scenario batch of this commit.'
