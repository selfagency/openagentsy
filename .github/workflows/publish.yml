name: publish

# A tag is a release. The tag's version must be the version every published
# package carries, and the packages go out in dependency order: the board
# first, then the selector, then the server, then the command.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and pack, but publish nothing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bunx --bun vitest run

      - name: The changelog
        run: bun scripts/changelog.mjs

      - name: The tag must match the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for package in packages/core packages/models packages/mcp packages/cli; do
            version="$(bun -e "console.log(require('./$package/package.json').version)")"
            if [ "$version" != "$tag" ]; then
              echo "::error::$package is at $version but the tag says $tag"
              exit 1
            fi
          done

      - name: Pack
        id: pack
        run: |
          for package in packages/core packages/models packages/mcp packages/cli; do
            name="$(bun -e "console.log(require('./$package/package.json').name)")"
            (cd "$package" && npm pack --pack-destination "$RUNNER_TEMP")
            echo "packed $name"
          done

      - name: Publish
        if: ${{ !inputs.dry-run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          for package in packages/core packages/models packages/mcp packages/cli; do
            name="$(bun -e "console.log(require('./$package/package.json').name)")"
            echo "::group::publishing $name"
            (cd "$package" && npm publish --provenance --access public)
            echo "::endgroup::"
          done

      - name: The release notes
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
