name: check

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm ci:check

      - name: Test
        run: pnpm test

      # On a pull request the base is the branch it targets. On a push to
      # develop the base is the head the push moved, so the gate sees only
      # what this push introduced; main is the release parent and is weeks
      # behind develop, which would gate every function added since it.
      - name: Fallow gate
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            pnpm exec fallow audit --base origin/${{ github.base_ref }} --format human --quiet
          else
            pnpm exec fallow audit --base "${{ github.event.before }}" --format human --quiet
          fi
