name: check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and typecheck
        run: bun run ci:check
        env:
          TURBO_TELEMETRY_DISABLED: "1"

      - name: Test
        run: bun run test
        env:
          TURBO_TELEMETRY_DISABLED: "1"

      # On a pull request the base is the branch it targets. On a push to
      # develop the base is the head the push moved, so the gate sees only
      # what this push introduced; main is the release parent and is weeks
      # behind develop, which would gate every function added since it.
      - name: Fallow gate
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            bunx fallow audit --health-baseline .fallow/health-baseline.json --base origin/${{ github.base_ref }} --format human --quiet
          else
            bunx fallow audit --health-baseline .fallow/health-baseline.json --base "${{ github.event.before }}" --format human --quiet
          fi
