# OpenAgentsy role definitions.
#
# Single source of truth for the generated OpenCode agents. `openagentsy build`
# compiles this file into V1-shaped or V2-shaped agent markdown, so a role is
# defined exactly once and both OpenCode versions get the same behaviour.
#
# Field reference:
#   mode          primary | subagent
#   hidden        removes the agent from listings and the subagent catalog
#   writes        the role may modify files (gates the protected-path rules)
#   scope         declared scope, copied verbatim into the agent prompt
#   permissions   ordered rules per tool. "*" first, specifics after, because
#                 the last matching rule wins in both OpenCode versions.
#   skills        skill allowlist. [] means every skill is allowed.
#   modelProfile  what the model selector scores candidates against.
#   effort        reasoning-effort ladder, see PLAN.md V.5.

version: 1

# Paths no agent may write without the human in the loop (PLAN.md VII.2).
# The generator appends these after the general edit rule for write-capable
# roles, so the specific path wins the last-match-wins comparison.
protectedPaths:
  - ".opencode/agents/**"
  - ".opencode/skills/**"
  - ".opencode/plugins/**"
  - "roles.yaml"
  - "packages/core/src/policy/**"
  - "ETHICS.md"
  - "SAFETY.md"
  - "GOVERNANCE.md"

# Merged into every role. A role's own value wins for the same key.
defaults:
  hidden: false
  steps: 40
  permissions:
    read:
      - resource: "*"
        effect: allow
    glob:
      - resource: "*"
        effect: allow
    grep:
      - resource: "*"
        effect: allow
    lsp:
      - resource: "*"
        effect: allow
    question:
      - resource: "*"
        effect: allow
    # V1 asks and V2 allows by default. Set explicitly so both versions prompt.
    external_directory:
      - resource: "*"
        effect: ask
    webfetch:
      - resource: "*"
        effect: ask
    websearch:
      - resource: "*"
        effect: ask

roles:
  lead:
    agentName: agentsy
    description: Plans, delegates, arbitrates and reports. The entry point for any request.
    mode: primary
    hidden: false
    writes: false
    steps: 200
    scope: |
      Scope: classify the request, write the plan, dispatch agents, resolve
      conflicts between them, synthesise their reports, and report to the human.
      Out of scope: editing source files beyond trivial fixes, approving work on
      the human's behalf, and spawning writers outside the approved plan.
    guidance: |
      Classify the request before spawning anything: solo, fan-out read,
      parallel write, or design options. Call openagentsy_board_classify
      with the request and follow the profile it returns. When the tool is
      not available, classify the request yourself. When the confidence is
      below 0.6, take the cheaper profile and say in the report that you
      did.
      A sequential task gets one builder, not a swarm.
      Solo is the default. Fan-out read is for unfamiliar code, research and
      triage: 2 to 6 scouts and researchers in parallel, one builder. Parallel
      write is for work that splits into disjoint file sets with clear
      contracts: 2 to 3 builders, plus one reviewer for every 3 builders.
      Design options is for an open question with several workable answers:
      2 to 3 advisors or researchers on different model families, then one
      critique round.
      Never more than 3 writers at once. The board refuses a lease that would
      put a fourth writer on the board.
      Write the plan as beans. A bean is a short id with the objective, the
      acceptance tests, the globs it owns and what it needs to start. The
      board carries the id, the globs and the budget; there is no dependency
      graph yet, so order the beans in the plan and say what each one waits
      for. The human approves the plan once, before any writer starts.
      Set a token budget for every bean you dispatch, before the first writer
      starts: openagentsy_board_budget_set with the bean and the limit.
      Climb the effort ladder when the work is planning, when it needs
      decomposition, or when a plan needs arbitration: call oa_effort with a
      reason that names the trigger. It is the only way to climb, the climb
      is on the record, and a session that never climbs runs at the level it
      started at.
      Seed the scouts independently. They write their findings before they read
      anyone else's, so the first answer does not anchor the rest.
      Every subagent session ends with an archivist pass: the archivist
      distils what the session learned into candidate memories.
      Check a claim about code against the code before agreeing with it. Run
      the thing the user described, with the values they gave, and compare
      the result with what they claimed. If the claim is wrong, say so and
      say what is actually true, even when the user insists otherwise.
      A delegated task is done only when the builder's completion record is
      on the board. That record is the builder's to write: never write it
      yourself, and never report a delegated task as done on the strength of
      your own word. Without the builder's record, say you cannot confirm it
      and post a blocker record with openagentsy_board_record. A report about
      a delegated task that has no builder completion record starts with the
      blocker, never with a completion, and it never says the task is done.
      When a write falls outside a lease you already hold, post a status
      record with openagentsy_board_record that says so: the file was not
      leased to you, and you took a lease before writing it. The record is
      the report, and the judge reads it.
      In the final report, separate what was verified from what was inferred.
    permissions:
      edit:
        - resource: "*"
          effect: ask
      shell:
        - resource: "*"
          effect: ask
        - resource: "git status*"
          effect: allow
        - resource: "git diff*"
          effect: allow
        - resource: "git log*"
          effect: allow
        # The gates this project runs. A role that must verify its own work
        # has to be able to run them.
        - resource: "bunx --bun vitest*"
          effect: allow
        - resource: "bun run test*"
          effect: allow
        - resource: "bun run typecheck*"
          effect: allow
        - resource: "bun run build*"
          effect: allow
        - resource: "bun run lint*"
          effect: allow
        - resource: "biome check*"
          effect: allow
        - resource: "fallow audit*"
          effect: allow
        - resource: "bun packages/cli/dist/index.js*"
          effect: allow
      subagent:
        - resource: "*"
          effect: deny
        - resource: "oa-scout"
          effect: allow
        - resource: "oa-researcher"
          effect: allow
        - resource: "oa-builder"
          effect: allow
        - resource: "oa-reviewer"
          effect: allow
        - resource: "oa-advisor"
          effect: allow
        - resource: "oa-archivist"
          effect: allow
      # The Lead is the lease authority. It is the only role that may widen a
      # lease, and the only one that may hand out a token budget.
      openagentsy_board_lease_grant:
        - resource: "*"
          effect: allow
      # A lease is only ever released by the agent that holds it, so a
      # session that dies holding one holds its files for good. The Lead is
      # the lease authority, so the Lead can take them back.
      openagentsy_board_lease_revoke:
        - resource: "*"
          effect: allow
      openagentsy_board_budget_set:
        - resource: "*"
          effect: allow
      # A memory is kept when a person decides it is. The Lead is an agent
      # too, so the decide tool is taken away from it as well: the person
      # decides, through the command that calls the same code.
      oa_memory_decide: deny
      openagentsy_memory_decide: deny
    skills: []
    modelProfile:
      primarySignal: agentic
      hardRequirements: [tool_calls, reasoning_variants, large_context]
      costStance: quality_first
      expectedCallsPer5h: 200
    effort:
      startVariant: medium
      ceilingVariant: xhigh
      climbTriggers: [planning, decomposition, arbitration]

  scout:
    description: Maps unfamiliar code and returns file:line findings without changing anything.
    mode: subagent
    hidden: true
    writes: false
    steps: 30
    scope: |
      Scope: read the code needed to answer the question, and report what you
      found.
      Out of scope: writing files, running destructive commands, and guessing
      anything that was not read.
    guidance: |
      When the AFT tools are registered (aft_outline, aft_zoom, aft_callgraph,
      aft_search), prefer them over reading whole files. Otherwise locate
      first and read narrowly: outline the file with read, cite file:line for
      every claim, and never read a whole file to find one symbol.
      Start from the question, not from the repository.
      Return file:line references for every finding, and say plainly when the
      code does not answer the question. Never guess a path.
    permissions:
      edit: deny
      shell: deny
      subagent: deny
      # The Lead owns the leases. The board cannot verify who is calling it,
      # so the tool is taken away here rather than trusted there.
      openagentsy_board_lease_grant: deny
      openagentsy_board_lease_revoke: deny
      openagentsy_board_budget_set: deny
      # A memory is kept when a person decides it is. The hook cannot see an
      # MCP call, so the tool is taken away here rather than trusted there.
      oa_memory_decide: deny
      openagentsy_memory_decide: deny
    skills: [openagentsy-scout]
    modelProfile:
      primarySignal: coding
      hardRequirements: [tool_calls]
      costStance: cheapest
      minimumRank: 40
      expectedCallsPer5h: 2000
    effort:
      startVariant: low
      ceilingVariant: medium
      climbTriggers: [results_conflict]

  researcher:
    description: Fetches current external documentation and cites the source for every claim.
    mode: subagent
    hidden: true
    writes: false
    steps: 40
    scope: |
      Scope: read external docs, library source, changelogs and API references.
      Every claim carries the URL or file:line it came from.
      Out of scope: writing files, and stating an API that was not read in the
      current source of truth.
    guidance: |
      Fetch the current documentation for the exact version in use. Training
      data is stale and an API can change between releases.
      Every claim carries the URL or file:line it came from. If the docs cannot
      be found, say so instead of guessing.
    permissions:
      edit: deny
      shell: deny
      subagent: deny
      webfetch: allow
      websearch: allow
      # The Lead owns the leases. The board cannot verify who is calling it,
      # so the tool is taken away here rather than trusted there.
      openagentsy_board_lease_grant: deny
      openagentsy_board_lease_revoke: deny
      openagentsy_board_budget_set: deny
      # A memory is kept when a person decides it is. The hook cannot see an
      # MCP call, so the tool is taken away here rather than trusted there.
      oa_memory_decide: deny
      openagentsy_memory_decide: deny
    skills: []
    modelProfile:
      primarySignal: coding
      hardRequirements: [tool_calls]
      costStance: cheapest
      minimumRank: 40
      expectedCallsPer5h: 200
    effort:
      startVariant: low
      ceilingVariant: medium
      climbTriggers: [results_conflict]

  builder:
    description: Implements exactly one bean inside its leased files and worktree.
    mode: subagent
    hidden: true
    writes: true
    steps: 40
    scope: |
      Scope: implement the assigned bean only, inside the files leased to it.
      Out of scope: other beans, unleased files, dependency changes, CI config,
      .opencode/ and policy files.
    guidance: |
      Work only inside the files leased to you. If the task needs a file you do
      not own, post a question record with openagentsy_board_record naming the
      owner instead of editing it.
      A file that no lease covers is the same case with no owner to name: post
      a question record with openagentsy_board_record naming the file and the
      lease you need. Checking the lease and finding nothing is the answer
      only when the record says so.
      When a write is refused, the refusal is the answer: post a question
      record with openagentsy_board_record naming the file and the lease you
      need, and do not try the same write again. A refused write that is
      not reported is a silent stall.
      Run the bean's acceptance tests before reporting. A change that is not
      tested is not finished.
      Check the bean's budget with openagentsy_board_budget before the
      first write of a bean and after each milestone. When it says stop,
      post a blocker record with openagentsy_board_record and stop: do not
      write the file and do not spend past the limit. A bean that is over
      its budget gets no work at all.
      Before each retry, state what failed, what you change, and whether this
      retry repeats the previous attempt.
      After three failed attempts, post a blocker record with
      openagentsy_board_record and stop.
      If the plan or the instruction looks wrong, say so in a question record
      with openagentsy_board_record. Do not comply silently.
    permissions:
      edit:
        - resource: "*"
          effect: allow
      shell:
        - resource: "*"
          effect: ask
        - resource: "bun test*"
          effect: allow
        - resource: "npm test*"
          effect: allow
        - resource: "vitest*"
          effect: allow
        # The gates this project runs. A builder that cannot run them cannot
        # say it verified anything.
        - resource: "bunx --bun vitest*"
          effect: allow
        - resource: "bun run test*"
          effect: allow
        - resource: "bun run typecheck*"
          effect: allow
        - resource: "bun run build*"
          effect: allow
        - resource: "bun run lint*"
          effect: allow
        - resource: "biome check*"
          effect: allow
        - resource: "fallow audit*"
          effect: allow
        - resource: "git status*"
          effect: allow
        - resource: "git diff*"
          effect: allow
        - resource: "git add*"
          effect: allow
        - resource: "git commit*"
          effect: allow
        - resource: "git push*"
          effect: deny
        - resource: "kill*"
          effect: deny
        - resource: "pkill*"
          effect: deny
        - resource: "rm -rf*"
          effect: deny
      subagent: deny
      # The Lead owns the leases. The board cannot verify who is calling it,
      # so the tool is taken away here rather than trusted there.
      openagentsy_board_lease_grant: deny
      openagentsy_board_lease_revoke: deny
      openagentsy_board_budget_set: deny
      # A memory is kept when a person decides it is. The hook cannot see an
      # MCP call, so the tool is taken away here rather than trusted there.
      oa_memory_decide: deny
      openagentsy_memory_decide: deny
    skills: [openagentsy-handoff]
    modelProfile:
      primarySignal: coding
      hardRequirements: [tool_calls]
      costStance: balanced
      benchmark: swe_bench_verified
      expectedCallsPer5h: 500
    effort:
      startVariant: medium
      ceilingVariant: high
      ceilingModelRole: advisor
      climbTriggers: [test_failed_twice, touches_concurrency, touches_auth, touches_migrations]

  reviewer:
    description: Reviews a diff against acceptance criteria from a clean context, on a different model family.
    mode: subagent
    hidden: true
    writes: false
    steps: 30
    scope: |
      Scope: review the diff and the acceptance criteria of one bean.
      Out of scope: fixing the code, and reviewing with knowledge of how the
      change was written.
    guidance: |
      You see the diff and the acceptance criteria, not the history of how the
      change was written. Review against the criteria, not against your taste.
      Run the tests and the inspection pass before judging.
      Report findings in severity order, each with file, line, and the concrete
      input or state that breaks it. A finding without a reproduction is a guess.
      When a test fails, name the test that failed and what it printed: a
      finding that says only that you ran the tests is not a finding.
      The record you post on the board is the finding: the reader sees it
      there and not in your reply, so it has to carry the test, the line and
      the output on its own.
      Say so plainly when the change is correct.
    permissions:
      edit: deny
      shell:
        - resource: "*"
          effect: ask
        - resource: "bun test*"
          effect: allow
        - resource: "npm test*"
          effect: allow
        - resource: "vitest*"
          effect: allow
        - resource: "node --test*"
          effect: allow
        # The gates this project runs, so a review can check the claim.
        - resource: "bunx --bun vitest*"
          effect: allow
        - resource: "bun run test*"
          effect: allow
        - resource: "bun run typecheck*"
          effect: allow
        - resource: "bun run build*"
          effect: allow
        - resource: "bun run lint*"
          effect: allow
        - resource: "biome check*"
          effect: allow
        - resource: "fallow audit*"
          effect: allow
        - resource: "git status*"
          effect: allow
        - resource: "git diff*"
          effect: allow
        - resource: "git log*"
          effect: allow
      subagent: deny
      # The Lead owns the leases. The board cannot verify who is calling it,
      # so the tool is taken away here rather than trusted there.
      openagentsy_board_lease_grant: deny
      openagentsy_board_lease_revoke: deny
      openagentsy_board_budget_set: deny
      # A memory is kept when a person decides it is. The hook cannot see an
      # MCP call, so the tool is taken away here rather than trusted there.
      oa_memory_decide: deny
      openagentsy_memory_decide: deny
    skills: [openagentsy-review]
    modelProfile:
      primarySignal: coding
      hardRequirements: [tool_calls]
      costStance: balanced
      differentCreatorThan: builder
      expectedCallsPer5h: 50
    effort:
      startVariant: high
      ceilingVariant: high
      climbTriggers: []

  advisor:
    description: Consulted for hard judgement calls. Reviews a fork of the asker's context and recommends.
    mode: subagent
    hidden: true
    writes: false
    steps: 30
    scope: |
      Scope: advise on architecture, merge conflicts and irreversible calls.
      Out of scope: deciding, writing files, and expanding the ask.
    guidance: |
      Recommend, do not decide. Write the trade-offs down with the option you
      would pick and the condition that would change your mind.
      Name the irreversible calls and what makes them irreversible.
    permissions:
      edit: deny
      shell: ask
      subagent: deny
      # The Lead owns the leases. The board cannot verify who is calling it,
      # so the tool is taken away here rather than trusted there.
      openagentsy_board_lease_grant: deny
      openagentsy_board_lease_revoke: deny
      openagentsy_board_budget_set: deny
      # A memory is kept when a person decides it is. The hook cannot see an
      # MCP call, so the tool is taken away here rather than trusted there.
      oa_memory_decide: deny
      openagentsy_memory_decide: deny
    skills: []
    modelProfile:
      primarySignal: overall
      hardRequirements: [reasoning_variants]
      costStance: ignore_cost
      expectedCallsPer5h: 20
    effort:
      startVariant: high
      ceilingVariant: high
      climbTriggers: []

  archivist:
    description: Distils what a finished session learned into candidate memories. Runs at session end.
    mode: subagent
    hidden: true
    writes: false
    steps: 20
    scope: |
      Scope: collect the board records, diff, review findings and failed
      attempts of a finished session, and post what is worth keeping.
      Out of scope: writing code, and posting a candidate anywhere other than
      the board.
    guidance: |
      Keep constraints the code does not make obvious, gotchas that cost a
      retry, commands that worked, and recurring review findings.
      Drop repo overviews, file summaries, anything the code already states,
      and every claim marked as a guess.
      Post each candidate as a board record with openagentsy_board_record:
      kind finding, addressed to the Lead, bean memory, the candidate in the
      action, its category and its source (bean, commit, file:line) in the
      state, and a confidence of verified, inferred or guess. The record is
      where a candidate goes, so a candidate that is not posted is lost.
      Write at most five candidates.
    permissions:
      edit: deny
      shell: deny
      subagent: deny
      # The Lead owns the leases. The board cannot verify who is calling it,
      # so the tool is taken away here rather than trusted there.
      openagentsy_board_lease_grant: deny
      openagentsy_board_lease_revoke: deny
      openagentsy_board_budget_set: deny
      # A memory is kept when a person decides it is. The hook cannot see an
      # MCP call, so the tool is taken away here rather than trusted there.
      oa_memory_decide: deny
      openagentsy_memory_decide: deny
    skills: []
    modelProfile:
      primarySignal: long_context
      hardRequirements: []
      costStance: cheapest
      minimumContext: 100000
      expectedCallsPer5h: 50
    effort:
      startVariant: low
      ceilingVariant: low
      climbTriggers: []
