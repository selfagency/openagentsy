[install]
# strict node_modules: an undeclared import fails, the layout has no hoisting to hide it.
linker = "isolated"
# `bun add` pins exact versions; ranges live in the workspace catalog.
exact = true
# A package published in the last day cannot be resolved, so a compromised
# release cannot be pulled before anyone has looked at it. Seven days was
# tried and blocked the opencode SDK and bun-types, which release faster
# than that.
minimumReleaseAge = 1440
